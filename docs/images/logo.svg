<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" width="440" height="96" role="img" aria-label="轻语 QingYu Care - AI 智能客服 SaaS 平台">
  <!--
    轻语标准锁定形式（图标 + 字标），README banner 用。

    ⚠️ 文字颜色刻意不用管理端那个近黑 slate：GitHub 暗色主题下背景是 #0d1117，
    深色字几乎不可见。靛蓝 #6366f1 与 slate-500 #64748b 在白底和暗底上都达标，
    因此一份文件通吃两种主题，不必做 <picture> 双套资产。

    ⚠️ 字标用系统字体渲染，跨平台字形会有差异（SVG 里的 text 取阅读者本机字体）。
    这是 banner 的常规取舍；要完全一致得把字转成路径，中文字形无法手工编写。

    ⚠️ 图标路径数据另有三处副本，改形状必须四处同步：
       frontend/public/logo.svg（favicon，**基准**）
       frontend/src/components/Logo.tsx（管理端）
       widget/src/logo.ts（悬浮球）
  -->
  <defs>
    <linearGradient id="qyLockupGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <mask id="qyLockupMask">
      <path d="M5 3h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H9.5L5 20.8V17a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" fill="#fff"/>
      <g stroke="#000" stroke-width="1.4" stroke-linecap="round">
        <path d="M8 7.4V13.4"/>
        <path d="M6.3 9.4H9.7"/>
        <path d="M6.3 11.9H9.7"/>
        <path d="M12.4 8.6H17.6"/>
        <path d="M15 8.6V12.6"/>
        <path d="M12.4 12.6H17.6"/>
      </g>
    </mask>
  </defs>

  <g transform="translate(12 20) scale(2.3333)">
    <rect width="24" height="24" fill="url(#qyLockupGradient)" mask="url(#qyLockupMask)"/>
  </g>

  <g font-family="&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans SC&quot;,&quot;Source Han Sans SC&quot;,sans-serif">
    <text x="86" y="48" font-size="30" font-weight="700" fill="#6366f1">轻语 QingYu Care</text>
    <text x="88" y="72" font-size="14" fill="#64748b">AI 智能客服 SaaS 平台</text>
  </g>
</svg>
