server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传走这里转给后端：知识库文档 30MB、聊天附件 20MB，与后端 multipart 32MB 对齐、留出余量
    client_max_body_size 40m;

    # 安全响应头（安全审查 L5，2026-09-03）。管理端不允许被 iframe 嵌入；widget 是 <script>
    # 嵌入、不走 iframe，不受 X-Frame-Options 影响。HSTS 只在外层 TLS 终结后才有意义，
    # 由做 HTTPS 的那一层加（见部署文档 5.3）。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP（2026-09-30 安全审查）：登录态 token 存在 localStorage，任何一处 XSS 都等于 token 被盗，这是纵深防御。
    # 脚本只许本域 + Turnstile；样式放行 inline（Radix / recharts 用 style 属性）；图片放行 https 是因为
    # 头像可填任意 https 地址（卡片图片另有应用级白名单，见安全基线第 47 条）。
    # ⚠️ 改这一行要在浏览器里逐页验：被拦的资源只在控制台报一条 CSP violation，页面不会报错。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的构建产物可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # ⚠️ location 里只要出现任何 add_header，就不再继承 server 级的 add_header——上面那组安全头在这里
        # 全部失效（2026-09-30 安全审查发现）。必须原样重复一遍，改上面时同步改这里。
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        # $http_host 带端口、$host 不带：前端不在 80/443 上时（compose 的 FRONTEND_PORT），用 $host 会让后端把
        # 同源请求判成跨域（Origin 带端口、重建出来的地址不带），整个后台登录不了，浏览器只显示「网络错误」
        # （2026-09-30 真机冒烟发现）。客户端能改 Host 但改不了浏览器发跨域请求时的 Host，不构成绕过。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # ⚠️ 覆盖而非追加（别改回 proxy_add_x_forwarded_for 变量）：后端的 ForwardedHeaderFilter
        # 取 X-Forwarded-For 的「第一段」当客户端 IP，追加模式下第一段是客户端自填的，
        # 登录 / 注册 / 访客的按 IP 限流全部可被伪造 IP 绕过。客户端自带的 Forwarded、
        # X-Forwarded-Port 同理清掉、X-Forwarded-Host 由下面覆盖（Forwarded 的 for= 优先级还高于 XFF）。
        # 前面若还有一层 CDN / 负载均衡，用 realip 模块（set_real_ip_from + real_ip_header）
        # 先把 $remote_addr 还原成真实客户端，别改回追加模式。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        # X-Forwarded-Host 由 nginx 覆盖成带端口的真实值，不能只清空：后端的 ForwardedHeaderFilter 一看到
        # X-Forwarded-Proto 就把端口重置成协议默认值，非 80/443 端口下同源请求会被判成跨域（真机冒烟发现）
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ SSE 必需，不是可选项。
        # 流式对话（/api/chat/stream、/open/v1/chat/stream）与坐席实时通道都走
        # EventStream。开着 buffering 会让 nginx 攒够缓冲区才下发，表现为
        # 「回复不逐字出现、整段一次性刷出」，而且没有任何报错——排查时极难
        # 联想到反代配置。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA history fallback：前端用 React Router，刷新 /knowledge 这类子路由
    # 必须回落到 index.html，否则 404。
    # 放在最后，且 /api/ 的 location 前缀更长会优先匹配，不会被这条吃掉。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
