server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传走这里转给后端：知识库文档 100MB、聊天附件 20MB，留出余量
    client_max_body_size 120m;

    # 安全响应头（安全审查 L5，2026-09-03）。管理端不允许被 iframe 嵌入；widget 是 <script>
    # 嵌入、不走 iframe，不受 X-Frame-Options 影响。HSTS 只在外层 TLS 终结后才有意义，
    # 由做 HTTPS 的那一层加（见部署文档 5.3）。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的构建产物可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ SSE 必需，不是可选项。
        # 流式对话（/api/chat/stream、/open/v1/chat/stream）与坐席实时通道都走
        # EventStream。开着 buffering 会让 nginx 攒够缓冲区才下发，表现为
        # 「回复不逐字出现、整段一次性刷出」，而且没有任何报错——排查时极难
        # 联想到反代配置。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA history fallback：前端用 React Router，刷新 /knowledge 这类子路由
    # 必须回落到 index.html，否则 404。
    # 放在最后，且 /api/ 的 location 前缀更长会优先匹配，不会被这条吃掉。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
