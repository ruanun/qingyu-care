# 轻语（QingYu Care）生产环境编排
#
# 用法：
#   cp .env.example .env && 编辑 .env 填入真实值
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d --build
#
# 与开发用的 docker-compose.yml 的区别：
#   · 多了 backend / frontend 两个应用服务，一条命令拉起全栈
#   · 数据库、Redis、对象存储都不再对宿主机暴露端口，只在容器网络内可达
#   · 凭据全部走 .env，不写死在文件里
#   · 所有服务 restart: unless-stopped
#
# ⚠️ 上线前请逐条过一遍 docs/部署文档.md 的「生产环境安全与调优清单」。

# 显式项目名，不能省。Compose 默认拿所在目录名（docker）当项目名，而
# docker-compose.yml 与本文件同在这个目录——不指定的话两者算同一个项目，
# postgres_data 等命名卷会解析成同一批实际卷，生产直接挂上开发库的数据。
name: qingyu-care-prod

services:
  # PostgreSQL with pgvector + zhparser（中文全文检索）
  postgres:
    build:
      context: ./postgres-zhparser
    image: qingyu/pgvector-zhparser:pg17
    container_name: qingyu-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ⚠️ 只在数据目录为空时执行一次。升级到带 zhparser 的镜像时，存量卷不会
      # 重跑本脚本，需手工 CREATE EXTENSION zhparser（见部署文档「故障手册」）。
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qingyu-network
    restart: unless-stopped

  # RustFS - S3 兼容对象存储（单节点单盘 SNSD 模式）
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.10
    container_name: qingyu-rustfs-prod
    security_opt:
      - "no-new-privileges:true"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_CONSOLE_ENABLE=false
      - RUSTFS_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${STORAGE_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qingyu-network
    restart: unless-stopped

  # 初始化 Bucket：x-file-storage 不会自动建桶，必须预创建，
  # 否则文档上传与聊天附件全部失败。
  createbuckets:
    image: minio/mc
    container_name: qingyu-createbuckets-prod
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myrustfs http://rustfs:9000 ${STORAGE_ACCESS_KEY} ${STORAGE_SECRET_KEY};
      /usr/bin/mc mb myrustfs/${STORAGE_BUCKET} --ignore-existing;
      echo 'Bucket ${STORAGE_BUCKET} 已就绪';
      exit 0;
      "
    networks:
      - qingyu-network

  # Redis：限流 + Webhook 投递队列（Redis Stream）+ 多实例实时通道 pub/sub
  redis:
    image: redis:7-alpine
    container_name: qingyu-redis-prod
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - qingyu-network
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: qingyu-care-backend:latest
    container_name: qingyu-backend-prod
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      CARDS_ENABLED: ${CARDS_ENABLED}
      REALTIME_REDIS_ENABLED: ${REALTIME_REDIS_ENABLED}
      QINGYU_ADMIN_INITIAL_PASSWORD: ${QINGYU_ADMIN_INITIAL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - qingyu-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: qingyu-care-frontend:latest
    container_name: qingyu-frontend-prod
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - qingyu-network
    restart: unless-stopped

volumes:
  postgres_data:
  rustfs_data:
  redis_data:

networks:
  qingyu-network:
    driver: bridge
