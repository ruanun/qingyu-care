server:
  port: 8080
  servlet:
    context-path: /api
  # 反向代理（nginx）终结 TLS 后转发给后端的是 http，而浏览器的 Origin 是 https——不读
  # X-Forwarded-* 的话 Spring 重建出来的请求 URI scheme 与 Origin 不符，同源请求会被判成跨域，
  # 撞上管理端的 CORS 白名单直接 403，整个后台登录不了（真机浏览器验证发现，2026-09-03）。
  # nginx.conf 已经在转发 X-Forwarded-Proto / X-Real-IP / X-Forwarded-For。
  # ⚠️ 前提是后端只经受信任的反代对外，别把 8080 直接暴露到公网——否则客户端可自造这些头。
  forward-headers-strategy: framework

spring:
  application:
    name: qingyu-care
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/qingyu_care
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 短超时：Redis 为可选依赖（限流/Webhook 队列均 fail-open），
      # 故障时快速失败进入降级路径，不拖慢业务线程
      connect-timeout: 1000
      timeout: 2000

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # 文件上传配置
  servlet:
    multipart:
      # 知识库文档 30MB（qingyu.care.knowledge.max-upload-bytes）、聊天附件 20MB，这里留一点余量。
      # 曾是 100MB：multipart 上限越大，被拒绝之前读进堆的字节就越多（安全审查 M8）
      max-file-size: 32MB
      max-request-size: 64MB

  # 异步请求超时：Servlet 规范默认 30s，长回复的流式对话（/v1/chat/stream、/open/v1/chat/stream）
  # 客户端刻意不重连（重连=重复发消息+重复计费），到点即被 cancel，用户看到半截回复且答案丢失。
  # 设明确上限而非 -1，避免异常连接永久占用 servlet 容器线程/资源。
  mvc:
    async:
      request-timeout: 180000

  # 定时任务线程池：Spring Boot 默认单线程（1），全仓 6 个 @Scheduled 共用。
  # 网页同步调度器（WebPageSyncScheduler）每小时批量逐篇抓取+重嵌，且逐篇之间按
  # site-crawl.default-delay-ms 限速（避免爬取产出的一批文档同时到期后对同一 host
  # 背靠背发请求）——LIMIT 50 篇、每篇 ≥1s，一轮耗时下限就有 ≈50s，上不封顶（单篇抓取
  # 本身的网络耗时另计）。若仍是单线程，会顶掉同一时刻该跑的其它定时任务（如
  # RealtimePresenceRegistry 心跳续期 STALE 阈值 45s、WebhookStreamConsumer 200ms 轮询），
  # 造成在线坐席被误判成僵尸、webhook 消费停摆。调大到 4，各 @Scheduled 任务不再互相阻塞。
  task:
    scheduling:
      pool:
        size: 4
    # 注意：spring.task.execution.* 刻意不配——那是 Boot 默认的 applicationTaskExecutor，
    # 现在只承载短任务（用量计量/审计日志/webhook 入队与直投），保持默认即可。
    # 长任务（文档摄取/QA 生成/批量重嵌/网页同步/站点爬取）走独立的有界池，
    # 见 AsyncConfig 与下方 qingyu.care.async.long-task.*

  # Spring AI 配置 (使用 OpenAI 兼容模式)
  ai:
    openai:
      # 通义千问 DashScope OpenAI 兼容端点
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      # base-url 必须自带 /v1：Spring AI 2.0 起改用官方 openai-java SDK，只拼 chat/completions
      # 与 embeddings，不再补 /v1（1.x 的 OpenAiApi 拼的是 /v1/xxx，故当年要求不带，契约已翻转）。
      # 本项同时喂给自动装配的 ChatModel 与 EmbeddingModel，缺 /v1 会让对话/摄取/检索全线 404。
      # 用 AI_BASE_URL 覆盖时同样必须带 /v1。
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      # Spring AI 2.0 起配置属性去掉 .options 中缀（chat.options.model → chat.model）
      chat:
        model: ${AI_CHAT_MODEL:qwen3.7-flash-2026-07-15}  # 通义千问 flash（2026-07-15 快照）；可用环境变量 AI_CHAT_MODEL 覆盖
        temperature: 0.7
      embedding:
        model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}
        # 显式钉死输出维度，不再依赖模型默认值——必须与下方 pgvector.dimensions 完全一致。
        # 两处共用 AI_EMBEDDING_DIMENSIONS，绑定同一变量以防各自漂移导致向量写入维度不匹配。
        # 注意：dimensions 仅 text-embedding-3 及以后 / DashScope text-embedding-v3+ 支持；
        # 若换用不支持该参数的模型，需先移除本项。
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}

    # PgVector 向量存储配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # 必须与上方 embedding.dimensions 一致（共用 AI_EMBEDDING_DIMENSIONS）。
        # 改动此值需重建向量表、历史向量作废——不可对已有库热切换。
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}  # 钉 1024；须与 embedding 模型实际输出维度一致（换模型后确认）

# Sa-Token 配置
sa-token:
  # token 名称
  token-name: satoken
  # token 有效期（秒）：7 天。曾是 30 天且无活跃超时——公共电脑上泄漏的 token 能用一个月（安全审查 M7）
  timeout: 604800
  # 无操作 12 小时即过期（秒）
  active-timeout: 43200
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 多人登录同一账号时各自持有独立 token：一个 token 泄漏不等于该账号全部会话泄漏，登出也只登出自己
  is-share: false
  # token 风格
  token-style: uuid
  # 是否输出日志
  is-log: true
  # 不读也不写 cookie：管理前端只用 satoken 请求头。Sa-Token 默认会把 token 写进 cookie，
  # 叠加跨域配置就是一条 CSRF 通道（安全审查 H6，2026-09-03）；SPA 用不到 cookie，关掉最省事。
  is-read-cookie: false

# 轻语自定义配置
qingyu:
  care:
    platform:
      # 平台管理员 admin 的初始口令。留空则首启生成随机口令、只打一次 WARN 日志；
      # 生产务必通过环境变量指定或首启后立即修改（安全审查 H1）。
      admin-initial-password: ${QINGYU_ADMIN_INITIAL_PASSWORD:}
    mcp:
      # 是否允许 MCP server 指向内网/环回（本地自建 server 时打开；生产保持 false）。
      # 与 model / webhook 的同名开关语义一致：放行私网，但云元数据段永不放行。
      allow-private-servers: ${MCP_ALLOW_PRIVATE_SERVERS:false}
    model:
      # 是否允许模型 endpoint 指向内网/环回（本地跑 Ollama 等自托管模型时打开；生产保持 false）
      allow-private-endpoints: ${MODEL_ALLOW_PRIVATE_ENDPOINTS:false}
    cors:
      # 管理端允许的跨域来源（逗号分隔，精确匹配 scheme://host[:port]）。前端与后端同源部署
      # （nginx 反代 /api、Vite 代理）时留空即可；只有前端单独部署到别的域名才需要填。
      # 开放 API（/open/v1/**）与 widget.js 不受此项约束，始终允许任意来源、不带凭据。
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # 知识库配置
    knowledge:
      # 单个上传文件上限（字节，30MB）；扩展名白名单见 KnowledgeServiceImpl.UPLOAD_EXTENSIONS
      max-upload-bytes: 31457280
      # 单个文件抽取正文的字符上限（超出截断，日志 WARN）与单文档 chunk 上限：封顶堆内存与 embedding 费用
      max-extracted-chars: 2000000
      max-chunks-per-document: 2000
      # 文档切分配置
      chunking:
        default-chunk-size: 1000
        default-overlap: 200
      # 注意: top-k 和 similarity-threshold 已移至数据库动态配置 (ChatStrategy)
    
    # 计费额度（调用数 / token 由 QuotaService 内置默认，可用下列键覆盖）
    billing:
      quota:
        # 租户对象存储上限（字节，0=不限）：知识库文件 + 聊天附件之和。
        # 爬取产生的 URL 类文档不占 S3（正文在库里），由站点爬取自身的页数硬顶约束，不计入。
        FREE:
          storage-bytes: 1073741824      # 1GB
        PRO:
          storage-bytes: 21474836480     # 20GB
        ENTERPRISE:
          storage-bytes: 0               # 不限

    # 开放 API 配置
    openapi:
      # 单个应用默认每分钟请求上限（应用可覆盖）
      default-rate-limit-per-minute: 60
      # 单个客户端（应用 + IP，X-Forwarded-For 取最后一段）每分钟上限，0 关闭。appKey 是公开的，
      # 没有这层子桶时一个滥用者就能让该应用所有真实访客一起吃 429（安全审查 M5）
      per-client-rate-limit-per-minute: 20

    # Webhook 事件推送配置
    webhook:
      # 最大投递尝试次数（含首次）
      max-attempts: 5
      # HTTP 连接/读取超时（毫秒）
      timeout-ms: 5000
      # 重试扫描间隔（毫秒）
      retry-scan-interval-ms: 30000
      # 各次失败后的退避分钟数
      backoff-minutes: [1, 5, 15, 30, 60]
      # Redis Stream 队列投递（关闭或 Redis 故障冷却期回退 @Async 直投，DB 重试扫描兜底）
      queue:
        enabled: true
        stream-key: "qingyu:webhook:deliveries"
        group: webhook-workers
        # 消费轮询间隔（毫秒，fixedDelay）
        poll-interval-ms: 200
        # 单次批量拉取条数 / XREADGROUP 阻塞等待（毫秒）
        batch-size: 16
        block-ms: 1000
        # 流近似截断长度（防无界增长）
        max-length: 10000
        # Redis 故障冷却时长（毫秒）：冷却期内直接直投
        failure-cooldown-ms: 5000

    # 聊天附件
    attachment:
      # 「传了没发送」的孤儿保留时长（小时），超过即连同 S3 对象一起删。曾是 24：孤儿是无凭据灌存储的
      # 唯一落点，窗口越短越好；2 小时足够「选了图还没点发送」的正常场景
      orphan-retain-hours: 2
      # 单个会话最多上传多少附件（含未挂到消息上的）
      max-per-session: 20
      # 清理任务首次延迟与间隔（毫秒）
      cleanup-initial-delay-ms: 600000
      cleanup-interval-ms: 3600000

    # 异步执行器分池：长任务与短任务不共用一个池（见 AsyncConfig 类注释）
    async:
      long-task:
        pool-size: 6        # 固定线程数（core == max；有界队列下 max 只在队列满后才生效，配大于 core 无意义）
        queue-capacity: 500 # 有界；排满即抛 TaskRejectedException，各调用方都有兜底，好过无界堆积到 OOM

    # 站点爬取（网站知识库第二期）
    site-crawl:
      max-pages-limit: 500        # 单次爬取页数硬顶
      max-depth-limit: 5          # 链接发现深度硬顶
      default-delay-ms: 1000      # 默认抓取间隔（robots 的 Crawl-delay 优先）
      max-delay-ms: 10000         # robots 的 Crawl-delay 上限——第三方可控值，不设上限时
                                   # Crawl-delay:300 × 500 页能占死共享线程池一个线程 40 小时
      max-concurrent-jobs: 2      # 全局并发爬取任务上限（不区分租户，保护共享 @Async 池）
      max-concurrent-jobs-per-tenant: 2   # 单租户并发爬取任务上限（全局上限之内再按租户分桶）

    # 结构化卡片配置
    cards:
      # 是否向系统 Prompt 注入卡片能力片段（仅非流式 chat() 生效，streamChat 恒不注入）
      enabled: ${CARDS_ENABLED:true}

    # 真人坐席实时推送（RealtimeHub）跨实例配置
    realtime:
      redis:
        # 是否启用 Redis pub/sub 跨实例桥接；false 时退化为单实例本地广播（省 Redis 往返）
        enabled: ${REALTIME_REDIS_ENABLED:true}
      presence:
        # 全局在线坐席花名册（Redis ZSET）心跳续期间隔（毫秒），须显著小于僵尸判定阈值 45000ms
        heartbeat-ms: 15000

    # 会话配置
    session:
      # 会话超时时间（分钟）
      timeout-minutes: 30
      # 最大历史消息数
      max-history-messages: 20
      # Token 裁剪阈值
      token-limit: 4000
    
    # Prompt 配置 (仅用于初始化默认模板，运行时从数据库读取)
    prompt:
      # 系统提示词
      system-template: |
        你是轻语，一个专业、友好的AI智能客服助手。
        请根据以下知识库内容回答用户问题：
        
        {context}
        
        回答要求：
        1. 基于知识库内容回答，不要编造信息
        2. 如果知识库中没有相关信息，请诚实说明并建议转接人工客服
        3. 保持专业、友好的语气
        4. 回答要简洁明了

# X File Storage 配置 (S3 兼容存储 - RustFS)
dromara:
  x-file-storage:
    default-platform: rustfs
    amazon-s3-v2:
      - platform: rustfs
        enable-storage: true
        access-key: ${STORAGE_ACCESS_KEY:rustfsadmin}
        secret-key: ${STORAGE_SECRET_KEY:rustfsadmin123}
        region: us-east-1
        end-point: ${STORAGE_ENDPOINT:http://localhost:9000}
        bucket-name: ${STORAGE_BUCKET:qingyu-care}
        domain: ""  # 留空使用 end-point + bucket-name 拼接
        base-path: knowledge/

# 日志配置
logging:
  level:
    root: INFO
    # 基线 INFO；dev profile 再抬到 DEBUG。org.springframework.ai 的 DEBUG 会把完整 prompt
    # （含知识库正文与访客消息）写进日志，生产不该开（安全审查 L4）
    com.qingyu.care: INFO
    org.springframework.ai: INFO
 

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        # 基线只暴露 health：/actuator/** 在 Sa-Token 豁免名单里，metrics 匿名可读（安全审查 M9）；dev profile 再放开
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    # 关闭 Redis 健康检查：限流用独立 Lettuce 客户端且 fail-open，Redis 可选，
    # 不应因 Redis 不可用而让 /actuator/health 整体 DOWN
    redis:
      enabled: false

# API 文档配置
# API 文档：基线关闭（路径在 Sa-Token 豁免名单里，匿名可读全部接口契约），只有 dev profile 打开（安全审查 M9）
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
    tags-sorter: alpha
    operations-sorter: alpha
