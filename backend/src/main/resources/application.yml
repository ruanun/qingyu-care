server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: qingyu-care
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/qingyu_care
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 短超时：Redis 为可选依赖（限流/Webhook 队列均 fail-open），
      # 故障时快速失败进入降级路径，不拖慢业务线程
      connect-timeout: 1000
      timeout: 2000

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  
  # Spring AI 配置 (使用 OpenAI 兼容模式)
  ai:
    openai:
      # 通义千问 DashScope OpenAI 兼容端点
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${AI_CHAT_MODEL:qwen3.7-flash-2026-07-15}  # 通义千问 flash（2026-07-15 快照）；可用环境变量 AI_CHAT_MODEL 覆盖
          temperature: 0.7
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding}
          # 显式钉死输出维度，不再依赖模型默认值——必须与下方 pgvector.dimensions 完全一致。
          # 两处共用 AI_EMBEDDING_DIMENSIONS，绑定同一变量以防各自漂移导致向量写入维度不匹配。
          # 注意：dimensions 仅 text-embedding-3 及以后 / DashScope text-embedding-v3+ 支持；
          # 若换用不支持该参数的模型，需先移除本项。
          dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}

    # PgVector 向量存储配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # 必须与上方 embedding.options.dimensions 一致（共用 AI_EMBEDDING_DIMENSIONS）。
        # 改动此值需重建向量表、历史向量作废——不可对已有库热切换。
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}  # 钉 1024；须与 embedding 模型实际输出维度一致（换模型后确认）

# Sa-Token 配置
sa-token:
  # token 名称
  token-name: satoken
  # token 有效期 (单位秒，默认 30 天)
  timeout: 2592000
  # token 临时有效期 (指定时间内无操作就视为过期，单位秒，-1 代表永不过期)
  active-timeout: -1
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token
  is-share: true
  # token 风格
  token-style: uuid
  # 是否输出日志
  is-log: true

# 轻语自定义配置
qingyu:
  care:
    # 知识库配置
    knowledge:
      # 文档切分配置
      chunking:
        default-chunk-size: 1000
        default-overlap: 200
      # 注意: top-k 和 similarity-threshold 已移至数据库动态配置 (ChatStrategy)
    
    # 开放 API 配置
    openapi:
      # 单个应用默认每分钟请求上限（应用可覆盖）
      default-rate-limit-per-minute: 60

    # Webhook 事件推送配置
    webhook:
      # 最大投递尝试次数（含首次）
      max-attempts: 5
      # HTTP 连接/读取超时（毫秒）
      timeout-ms: 5000
      # 重试扫描间隔（毫秒）
      retry-scan-interval-ms: 30000
      # 各次失败后的退避分钟数
      backoff-minutes: [1, 5, 15, 30, 60]
      # Redis Stream 队列投递（关闭或 Redis 故障冷却期回退 @Async 直投，DB 重试扫描兜底）
      queue:
        enabled: true
        stream-key: "qingyu:webhook:deliveries"
        group: webhook-workers
        # 消费轮询间隔（毫秒，fixedDelay）
        poll-interval-ms: 200
        # 单次批量拉取条数 / XREADGROUP 阻塞等待（毫秒）
        batch-size: 16
        block-ms: 1000
        # 流近似截断长度（防无界增长）
        max-length: 10000
        # Redis 故障冷却时长（毫秒）：冷却期内直接直投
        failure-cooldown-ms: 5000

    # 结构化卡片配置
    cards:
      # 是否向系统 Prompt 注入卡片能力片段（仅非流式 chat() 生效，streamChat 恒不注入）
      enabled: ${CARDS_ENABLED:true}

    # 真人坐席实时推送（RealtimeHub）跨实例配置
    realtime:
      redis:
        # 是否启用 Redis pub/sub 跨实例桥接；false 时退化为单实例本地广播（省 Redis 往返）
        enabled: ${REALTIME_REDIS_ENABLED:true}
      presence:
        # 全局在线坐席花名册（Redis ZSET）心跳续期间隔（毫秒），须显著小于僵尸判定阈值 45000ms
        heartbeat-ms: 15000

    # 会话配置
    session:
      # 会话超时时间（分钟）
      timeout-minutes: 30
      # 最大历史消息数
      max-history-messages: 20
      # Token 裁剪阈值
      token-limit: 4000
    
    # Prompt 配置 (仅用于初始化默认模板，运行时从数据库读取)
    prompt:
      # 系统提示词
      system-template: |
        你是轻语，一个专业、友好的AI智能客服助手。
        请根据以下知识库内容回答用户问题：
        
        {context}
        
        回答要求：
        1. 基于知识库内容回答，不要编造信息
        2. 如果知识库中没有相关信息，请诚实说明并建议转接人工客服
        3. 保持专业、友好的语气
        4. 回答要简洁明了

# X File Storage 配置 (S3 兼容存储 - RustFS)
dromara:
  x-file-storage:
    default-platform: rustfs
    amazon-s3-v2:
      - platform: rustfs
        enable-storage: true
        access-key: ${STORAGE_ACCESS_KEY:rustfsadmin}
        secret-key: ${STORAGE_SECRET_KEY:rustfsadmin123}
        region: us-east-1
        end-point: ${STORAGE_ENDPOINT:http://localhost:9000}
        bucket-name: ${STORAGE_BUCKET:qingyu-care}
        domain: ""  # 留空使用 end-point + bucket-name 拼接
        base-path: knowledge/

# 日志配置
logging:
  level:
    root: INFO
    com.qingyu.care: DEBUG
    org.springframework.ai: DEBUG
 

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # 关闭 Redis 健康检查：限流用独立 Lettuce 客户端且 fail-open，Redis 可选，
    # 不应因 Redis 不可用而让 /actuator/health 整体 DOWN
    redis:
      enabled: false

# API 文档配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
